# Daily: merge OpenListTeam/OpenList-Worker main into a branch and open a PR.
# Merging the PR deploys (Workers Builds). Our wrangler.jsonc and README.md win on conflict.
# Uses GITHUB_TOKEN. Optional secret SYNC_TOKEN (fine-grained PAT: Contents, Pull requests,
# Workflows read/write) is used instead when set. Without it, a sync that touches
# .github/workflows can't be pushed. Issues are off in this fork, so cases that need a
# manual merge fail the job with an ::error:: annotation (shown in the failure email).
name: upstream sync

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'haimcslab/OpenList-Worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git config user.name "upstream-sync"
          git config user.email "builder@haimcslab.com"
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind"
          if [ "$behind" = 0 ]; then echo "Up to date."; exit 0; fi
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^upstream-sync/'; then
            echo "An upstream sync PR is already open."; exit 0
          fi
          branch="upstream-sync/$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/main; then
            for f in wrangler.jsonc README.md; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then git checkout --ours -- "$f"; git add "$f"; fi
            done
            # Translated READMEs are deleted here; keep them deleted when upstream edits them.
            git diff --name-only --diff-filter=U | grep -E '^readmes/[^/]+\.md$' | xargs -r git rm -q --
            left=$(git diff --name-only --diff-filter=U)
            if [ -n "$left" ]; then
              git merge --abort
              echo "::error::Upstream has $behind new commits that conflict in: $(echo $left). Merge manually in a PR (keep our wrangler.jsonc D1 config and README)."
              exit 1
            fi
            git commit --no-edit
          fi
          if ! git push -u origin "$branch"; then
            if git diff --name-only origin/main HEAD | grep -q '^\.github/workflows/'; then
              echo "::error::Upstream has $behind new commits that change .github/workflows, which GITHUB_TOKEN can't push. Merge upstream manually in a PR, or add a SYNC_TOKEN secret."
              exit 1
            fi
            exit 1
          fi
          log=$(git log --oneline --no-merges HEAD^1..upstream/main | head -60)
          gh pr create --base main --head "$branch" \
            --title "chore(sync): merge upstream main ($behind commits)" \
            --body "$(printf 'Automated merge of OpenListTeam/OpenList-Worker main. Our wrangler.jsonc and README.md are kept on conflict. Merging deploys.\n\n```\n%s\n```' "$log")"
