# /oc builder: comment "/oc <request>" on an issue or PR. Logic lives in haimcslab/oc-builder.
name: oc builder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: oc-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  oc:
    uses: haimcslab/oc-builder/.github/workflows/builder.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      CF_WORKERS_AI_TOKEN: ${{ secrets.CF_WORKERS_AI_TOKEN }}
